# 原生客户端：测试 + 打包（Windows 便携版 zip、安卓 APK）
# 推到 main 或手动触发：产物在这次运行的 Artifacts 里
# 推 v* 标签：额外发一个 GitHub Release，附上两个安装包
name: client

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', '.github/workflows/client.yml']
    tags: ['v*']
  pull_request:
    paths: ['app/**', 'src/**', '.github/workflows/client.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 两边的联测都要真实服务端
      - run: bash scripts/build.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 核心库（加密测试数据 + 联测）
        working-directory: app/core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: 客户端（静态检查 + 联测）
        working-directory: app/client
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 版本号：打 v1.2.3 标签时用标签，否则用 pubspec 里的；构建号用运行序号（安卓靠它判断能否覆盖升级）
      - name: 版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(awk '/^version:/{split($2,a,"+"); print a[1]}' app/client/pubspec.yaml)"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "版本 $v（构建 $GITHUB_RUN_NUMBER）"
      - name: 构建
        working-directory: app/client
        shell: bash
        run: flutter build windows --release --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define=APP_VERSION="$APP_VERSION"
      - name: 打包
        shell: pwsh
        run: |
          $out = "CipherIM-windows-x64"
          Copy-Item -Recurse app/client/build/windows/x64/runner/Release $out
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CipherIM-windows-x64
          path: CipherIM-windows-x64.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 正式签名：仓库 Secrets 里配了密钥才用；没配就是调试签名（只适合自己测试）
      - name: 签名密钥
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        working-directory: app/client/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      # 版本号：打 v1.2.3 标签时用标签，否则用 pubspec 里的；构建号用运行序号（安卓靠它判断能否覆盖升级）
      - name: 版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(awk '/^version:/{split($2,a,"+"); print a[1]}' app/client/pubspec.yaml)"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "版本 $v（构建 $GITHUB_RUN_NUMBER）"
      - name: 构建
        working-directory: app/client
        run: flutter build apk --release --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define=APP_VERSION="$APP_VERSION"
      - run: cp app/client/build/app/outputs/flutter-apk/app-release.apk CipherIM-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CipherIM-android
          path: CipherIM-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CipherIM-windows-x64.zip CipherIM-android.apk --repo "$GITHUB_REPOSITORY" --generate-notes
