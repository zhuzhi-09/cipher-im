name: cipherim
description: "Cipher IM 原生客户端（Windows / 安卓）：端到端加密聊天，自己部署的服务器。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cipher_core:
    path: ../core
  dynamic_color: ^1.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  tray_manager: ^0.5.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/icon.png
